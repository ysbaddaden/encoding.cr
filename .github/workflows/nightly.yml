name: CI

on:
  schedule:
    - cron: "0 6 * * *"

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/import_wpt.js
      - run: crystal spec
